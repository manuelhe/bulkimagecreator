[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulkimagecreator"
version = "0.1.0"
description = "A CLI tool that transforms reference images into a curated seed image, then traverses a prompt catalog to generate a batch of image variations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
bulkimagecreator = "bulkimagecreator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bulkimagecreator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
